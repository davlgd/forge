[workspace]
members = ["crates/github-api"]
resolver = "3"

[package]
name = "github-dashboard"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
publish = false
description = "Forge: a personal GitHub dashboard"
repository = "https://github.com/davlgd/forge"

[dependencies]
axum = "0.8"
github-api = { path = "crates/github-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
