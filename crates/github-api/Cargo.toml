[package]
name = "github-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
description = "Read-only github-rust adapter for Forge"
repository = "https://github.com/davlgd/forge"
publish = false

[dependencies]
futures-util = "0.3"
github-rust = "0.2.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["process", "time"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "net", "io-util"] }
